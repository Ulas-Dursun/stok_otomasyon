version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: market_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend-rust:
    build:
      context: ./backend-rust
      dockerfile: Dockerfile
    container_name: market_backend_rust
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - JWT_SECRET_KEY=your_secret_key
    depends_on:
      - mongodb

  frontend-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market_frontend_go
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - RUST_API_URL=http://backend-rust:3030
      - JWT_SECRET_KEY=your_secret_key
      - SUPER_KEY=super123
      - PORT=8080
    depends_on:
      - backend-rust
      - mongodb

volumes:
  mongo-data:
