[package]
name = "stok_otomasyon"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3.30"
sha2 = "0.10"
warp = "0.3"
regex = "1.10.6"
log = "0.4.22"
mongodb = { version = "2.0", default-features = false, features = ["tokio-runtime"] }
jsonwebtoken = "8"
env_logger = "0.9"
chrono = "0.4.38"
dotenv = "0.15"
