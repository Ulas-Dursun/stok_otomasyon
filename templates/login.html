<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Stok & Market Otomasyonu</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="card">
        <div class="auth-header">
            <h2>Giriş Yap</h2>
            <p>Stok & Market Otomasyon Sistemi</p>
        </div>

        {{if .Error}}
            <div class="alert alert-danger">{{.Error}}</div>
        {{end}}

        <form action="/login/submit" method="POST">
            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" name="username" placeholder="Kullanıcı adınızı girin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Giriş Yap</button>
        </form>

        <div class="auth-footer">
            Hesabınız yok mu? <a href="/register">Hemen Kaydolun</a>
        </div>
    </div>
</div>
</body>
</html>
