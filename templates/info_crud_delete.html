<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi Sil | Stok Otomasyonu</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="auth-wrapper" style="max-width: 440px;">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title" style="color: var(--danger);">🗑️ Bilgi Sil</h2>
            <a href="/info/crud/list" class="btn btn-outline btn-sm">Listeye Dön</a>
        </div>

        <p style="color: var(--gray); font-size: 14px; margin-bottom: 20px;">
            Silmek istediğiniz bilginin ID numarasını girin. Bu işlem geri alınamaz.
        </p>

        <form action="/perform_crud" method="POST">
            <input type="hidden" name="entity" value="info">
            <input type="hidden" name="operation" value="delete">

            <div class="form-group">
                <label for="id">Bilgi ID (#)</label>
                <input type="text" id="id" name="id" placeholder="Örn: 1" required autofocus>
            </div>

            <button type="submit" class="btn btn-danger btn-block">Bilgiyi Kalıcı Olarak Sil</button>
        </form>
    </div>
</div>
</body>
</html>
