<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Stok & Market Otomasyonu</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<div class="auth-wrapper" style="max-width: 480px;">
    <div class="card">
        <div class="auth-header">
            <h2>Yeni Hesap Oluştur</h2>
            <p>Stok & Market Otomasyon Sistemi</p>
        </div>

        {{if .}}
            <div class="alert alert-danger">{{.}}</div>
        {{end}}

        <form action="/register" method="POST">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label for="ad">Ad</label>
                    <input type="text" id="ad" name="ad" placeholder="Adınız" required>
                </div>
                <div class="form-group">
                    <label for="soyad">Soyad</label>
                    <input type="text" id="soyad" name="soyad" placeholder="Soyadınız" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label for="yas">Yaş</label>
                    <input type="number" id="yas" name="yas" min="1" placeholder="21" required>
                </div>
                <div class="form-group">
                    <label for="cinsiyet">Cinsiyet</label>
                    <select id="cinsiyet" name="cinsiyet" required>
                        <option value="Erkek">Erkek</option>
                        <option value="Kadın">Kadın</option>
                        <option value="Belirtilmemiş">Belirtilmemiş</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" name="username" placeholder="kullanici_adi" required>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="super-key-box">
                <label for="super_key">🔑 Super Key (Yönetici Anahtarı - Opsiyonel)</label>
                <input type="password" id="super_key" name="super_key" placeholder="Varsa admin anahtarınızı girin">
                <small>Yönetici (Superuser) hesabı açmak için özel anahtardır. Normal kayıt için boş bırakın.</small>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Kayıt Ol</button>
        </form>

        <div class="auth-footer">
            Zaten hesabınız var mı? <a href="/login">Giriş Yapın</a>
        </div>
    </div>
</div>
</body>
</html>
